project:
  name: intelligent-document-analysis
  version: 0.1.0

paths:
  raw_data: data/raw
  processed_data: data/processed
  samples: data/samples
  annotation_data: data/processed/annotation
  extraction_data: data/processed/extraction

ingestion:
  input_directory: data/raw

  test_files:
    pdf: data/raw/pdf/sample-10-page-pdf-a4-size.pdf
    docx: data/raw/docx/sample-files.com-basic-text.docx
    ocr: data/raw/pdf/sample-ocr.pdf

  ocr:
    start_page: 11
    end_page: 30

embedding:
  model_name: all-MiniLM-L6-v2

chunking:
  chunk_size: 1000
  chunk_overlap: 200

output:
  max_text_preview_length: 200

vectorstore:
  db_path: data/vectorstore
  collection_name: documents

annotation:
  annotation_sample_size: 200
  annotation_random_seed: 42

  annotation_train_ratio: 0.70
  annotation_validation_ratio: 0.15
  annotation_test_ratio: 0.15

  entity_labels:
    - ORGANIZATION
    - PERSON
    - LOCATION
    - DATE
    - MONEY
    - PERCENTAGE
    - NUMBER
    - PRODUCT
    - FINANCIAL_METRIC
    - DOCUMENT_REFERENCE
